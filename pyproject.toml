[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gaius"
version = "1.0.0"
description = "File-first memory system for AI agents"
authors = [{ name = "Clawford Labs" }]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1",
  "mcp>=1.0",
  "pypdf>=4.0",
  "sqlite-vec>=0.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
fastembed = [
  "fastembed>=0.3",
]

[project.scripts]
gaius = "gaius.cli:cli"
gaius-mcp = "gaius.mcp_server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
